# Local-first Docker Compose deployment for Favlist, with optional Caddy HTTPS.
name: favlist

services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/favlist.db}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.55.10/32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      COVERS_DIR: /data/covers
      TAG_CONFIG_PATH: /app/config.yaml
    volumes:
      - favlist-data:/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.55.20
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      TRUSTED_EDGE_PROXY: ${TRUSTED_EDGE_PROXY:-172.30.55.1}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.55.10
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles:
      - caddy
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.55.30
    restart: unless-stopped

volumes:
  favlist-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.55.0/24
